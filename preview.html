// Helper for fetch with timeout
async function fetchWithTimeout(resource, options = {}) {
  const { timeout = 120000 } = options; // Increased to 2 mins for Render cold starts
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(resource, { ...options, signal: controller.signal });
    clearTimeout(id);
    return response;
  } catch (error) {
    clearTimeout(id);
    throw error;
  }
}

};

document.getElementById("payBtn").onclick = async function(){

<script>
function createRain() {
  const elements = ['🌸', '🌹', '🌻', '💖', '✨', '🌷', '💝', '🌼', '🦋'];
  setInterval(() => {
    const el = document.createElement('div');
    el.classList.add('falling-element');
    el.innerHTML = elements[Math.floor(Math.random() * elements.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (Math.random() * 18 + 16) + 'px';
    const duration = (Math.random() * 4 + 4);
    el.style.animationDuration = duration + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }, 350);
}
document.addEventListener('DOMContentLoaded', createRain);
</script>
